version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: meter
    main: ./cmd/meter
    binary: meter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: meter
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - configs/*.json

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: vaish725
    name: tokenmeter

# Two single-arch images, combined into one multi-arch tag below - Dockerfile.
# goreleaser (not the top-level Dockerfile, which is for a local `docker
# build` from source) expects the binary goreleaser already cross-compiled.
dockers:
  - id: meter-amd64
    image_templates:
      - "ghcr.io/vaish725/tokenmeter:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: amd64
    # goreleaser's plain "docker build" doesn't set the image's target
    # platform on its own - verified locally: without this, every image
    # came out tagged for the host's own arch (arm64) regardless of goarch,
    # which would have shipped a broken "-amd64" tag containing an arm64
    # binary. buildx + an explicit --platform fixes it.
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    extra_files:
      - configs
  - id: meter-arm64
    image_templates:
      - "ghcr.io/vaish725/tokenmeter:{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: arm64
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    extra_files:
      - configs

docker_manifests:
  - name_template: "ghcr.io/vaish725/tokenmeter:{{ .Version }}"
    image_templates:
      - "ghcr.io/vaish725/tokenmeter:{{ .Version }}-amd64"
      - "ghcr.io/vaish725/tokenmeter:{{ .Version }}-arm64"
  - name_template: "ghcr.io/vaish725/tokenmeter:latest"
    image_templates:
      - "ghcr.io/vaish725/tokenmeter:{{ .Version }}-amd64"
      - "ghcr.io/vaish725/tokenmeter:{{ .Version }}-arm64"

# Points at a separate homebrew-tap repo (not yet created) - `brew install
# vaish725/tap/meter` once a real release publishes there. `brews` (the
# classic Formula pipeline) is deprecated in goreleaser v2 in favor of
# homebrew_casks, which now also covers plain CLI binaries via `binaries:`,
# not just .app bundles - confirmed via `goreleaser check` against the
# locally installed goreleaser (2.17.1); `binary:` (singular) is itself
# a deprecated alias for `binaries:` as of the same version.
homebrew_casks:
  - name: meter
    binaries: [meter]
    repository:
      owner: vaish725
      name: homebrew-tap
    directory: Casks
    homepage: "https://github.com/vaish725/tokenmeter"
    description: "Local LLM spend proxy with per-project attribution and daily caps"
    license: "MIT"
    # The binary isn't codesigned/notarized (no Apple Developer account in
    # this pipeline), so macOS quarantines it on download and Gatekeeper
    # kills it on first run (SIGKILL, exit 137) - verified locally right
    # after a real `brew install --cask meter`. Clearing the quarantine bit
    # post-install is the standard fix for unsigned CLI-only casks.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/meter"]
          end
